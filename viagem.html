<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        * {
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 2fr));
            gap: .2rem;
            
            
        }

        .item {
            
            height: 3rem;
            border: .2rem solid red;
            border-radius: .5rem;
            padding: 1rem;
            margin: .5rem;
            gap: .4rem;
            align-items: center;
            
                   
        }

        .header {
            height: .5rem;
            background-color: rgba(152, 5, 250, 0.808);
            border-radius: .5rem;
            margin: .5rem;
            display: flex;
        justify-content: center;
        align-items: center;
        height: 10vh;
        }
    </style>
</head>

<body>
    <div class = "header">
        Agência de Viagens   
    </div>

    <div class="container">
        <div class="item">Origem</div>
        <div class="item">Destino</div>
        <div class="item">Dias</div>
        <div class="item">Preço</div>   
    </div>
    <div class = "main">
        <img src="https://2.bp.blogspot.com/-qJmZvDln6qI/Uh4oDZYbDMI/AAAAAAAAAG8/DkRFgRJHI7c/s1600/kll.jpg" 
        alt="Imagem de viagem" style="width: 25%; height: auto; border-radius: 1rem; margin-top: 1rem; ">
        <img src = "https://tse4.mm.bing.net/th/id/OIP.qW82w-xz-csV3EZ3_iO1XwHaHa?r=0&pid=ImgDet&w=202&h=202&c=7&o=7&rm=3"
         alt="Imagem de viagem" style="width: 18%; height: auto; border-radius: 1rem; margin-top: 1rem; ">
        <img src = "https://www.bing.com/th/id/OIP.g6v3B55ggANyGRWm7FKKjwHaE7?w=193&h=135&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2" 
        alt="Imagem de viagem" style="width: 25%; height: auto; border-radius: 1rem; margin-top: 1rem; display:flex; ">
    </div>


</body>

</html>
